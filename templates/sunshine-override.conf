[Service]
# X session environment for headless capture.
# DISPLAY: the X server Sunshine should connect to (typically :0).
Environment="DISPLAY=:0"

# Sunshine also needs XAUTHORITY. The installer adds this line to
# ~/.xprofile so each graphical login pushes the active X session
# credentials into the user systemd environment:
#   dbus-update-activation-environment --systemd DISPLAY XAUTHORITY
#
# If lingering starts Sunshine before graphical login has finished, wait
# briefly for .xprofile to publish XAUTHORITY before launching sunshine.
ExecStartPre=/bin/sh -c 'i=0; while [ "$$i" -lt 60 ]; do systemctl --user show-environment | grep -q "^XAUTHORITY=" && exit 0; i=$$((i + 1)); sleep 1; done; echo "XAUTHORITY not available in systemd user environment" >&2; exit 1'
#
# Verify after a login:
#   systemctl --user show-environment | grep XAUTHORITY
